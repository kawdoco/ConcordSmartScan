server.port=8080
spring.application.name=backend

# JWT Configuration
# Secret is Base64-encoded value of: ConcordSmartScanSuperSecretKeyThatIsAtLeast32Chars!
jwt.secret=Q29uY29yZFNtYXJ0U2NhblN1cGVyU2VjcmV0S2V5VGhhdElzQXRMZWFzdDMyQ2hhcnMh
jwt.expiration=86400000

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/concord_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway (Migrations)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

